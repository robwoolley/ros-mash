---
name: Run tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    uses: colcon/ci/.github/workflows/pytest.yaml@main
    with:
      # mash requires Python >=3.9 (pyproject.toml); the shared matrix
      # still includes 3.8, which can't install setuptools>=77
      matrix-filter: '.matrix.python -= ["3.8"]'
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: yamllint -f github .
